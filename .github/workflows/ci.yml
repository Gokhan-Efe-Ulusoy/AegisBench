name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff

      - name: Run tests
        run: python -m pytest

      - name: Ruff check
        run: ruff check src tests benchmark examples

      - name: Ruff format check
        run: ruff format --check src tests benchmark examples

      - name: Smoke test (safe fixture, expect exit 0)
        run: aegisbench scan tests/fixtures/safe --format text

      - name: Smoke test (risky fixture, expect exit 1)
        run: |
          set +e
          aegisbench scan tests/fixtures/risky --format json > /tmp/risky.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit code 1 for risky fixture, got $code"
            exit 1
          fi
          python -c "import json; d = json.load(open('/tmp/risky.json')); assert d['finding_count'] == 1, d"

      - name: Benchmark integrity (development set)
        run: python -m aegisbench.benchmark > /dev/null

      - name: Benchmark integrity (held-out set)
        run: python -m aegisbench.heldout > /dev/null
