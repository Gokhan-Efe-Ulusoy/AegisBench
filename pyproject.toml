[project]
name = "aegisbench"
version = "0.1.0"
description = "Evidence-based static analyzer for AI-agent tool permission fixtures (research prototype)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AegisBench Contributors" }]
keywords = ["security", "static-analysis", "ai-agents", "research"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.9.0",
  "pydantic>=2.0",
]

[project.urls]
Homepage = "https://example.invalid/aegisbench"

[project.scripts]
aegisbench = "aegisbench.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
